<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHICKEN INVASION: ULTIMATE BOSS EDITION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #game-wrap { position: relative; width: 420px; height: 640px; border: 3px solid #38bdf8; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); }
    canvas { display: block; background: #0b0f19; }
    .screen { position: absolute; inset: 0; background: rgba(11, 15, 25, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    h1 { color: #38bdf8; margin-bottom: 10px; font-size: 2rem; text-shadow: 0 0 10px #38bdf8; }
    p { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5; }
    button { background: #38bdf8; color: #0b0f19; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; box-shadow: 0 0 15px #38bdf8; }
    button:hover { background: #0ea5e9; color: #fff; transform: scale(1.05); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas" width="420" height="640"></canvas>
  
  <div id="start-screen" class="screen">
    <h1>ULTIMATE CHICKEN 🐔</h1>
    <p>Geser Pesawat (Panah / Drag HP)<br>Nembak Otomatis!<br><br><b style="color:#facc15">Ada Boss Fight & Power-Up Tembakan!</b></p>
    <button onclick="startGame()">MAIN SEKARANG</button>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <h1 style="color: #ef4444;">GAME OVER 💀</h1>
    <p id="final-score">Skor Lu: 0</p>
    <button onclick="startGame()">MAIN LAGI</button>
  </div>

  <div id="win-screen" class="screen hidden">
    <h1 style="color: #22c55e;">VICTORY! 🎉</h1>
    <p>Lu Berhasil Ngalahin BOSS Ayam & Namatin Game Ini!</p>
    <button onclick="startGame()">MAIN LAGI</button>
  </div>
</div>

<script>
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');

let player, bullets, enemies, particles, items, boss, score, lives, gameLoop, isPlaying = false;
let keys = {}, shootTimer = 0, enemyTimer = 0, stars = [];

// Bintang background
for(let i=0; i<50; i++) stars.push({x: Math.random()*cvs.width, y: Math.random()*cvs.height, r: Math.random()*2, s: Math.random()*1 + 0.5});

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  let rect = cvs.getBoundingClientRect();
  let touchX = e.touches[0].clientX - rect.left;
  if(player) player.x = Math.max(0, Math.min(cvs.width - player.w, touchX - player.w / 2));
});

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('win-screen').classList.add('hidden');
  
  player = { x: 190, y: 560, w: 40, h: 20, speed: 8, weaponLevel: 1, weaponTimer: 0 };
  bullets = []; enemies = []; particles = []; items = []; boss = null;
  score = 0; lives = 3; isPlaying = true;

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 1000 / 60);
}

function spawnExplosion(x, y, color) {
  for(let i=0; i<12; i++) {
    particles.push({x: x, y: y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 20, color: color});
  }
}

function update() {
  if (!isPlaying) return;

  // Starfield
  stars.forEach(s => { s.y += s.s; if(s.y > cvs.height) s.y = 0; });

  // Move Player
  if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < cvs.width - player.w) player.x += player.speed;

  // Powerup timer
  if(player.weaponTimer > 0) { player.weaponTimer--; if(player.weaponTimer <= 0) player.weaponLevel = 1; }

  // Auto Shoot
  shootTimer++;
  if (shootTimer > 7) {
    if(player.weaponLevel === 1) {
      bullets.push({ x: player.x + player.w/2 - 3, y: player.y, vx: 0, vy: -12, w: 6, h: 14 });
    } else {
      // Triple Shot!
      bullets.push({ x: player.x + player.w/2 - 3, y: player.y, vx: 0, vy: -12, w: 6, h: 14 });
      bullets.push({ x: player.x, y: player.y, vx: -3, vy: -11, w: 6, h: 14 });
      bullets.push({ x: player.x + player.w, y: player.y, vx: 3, vy: -11, w: 6, h: 14 });
    }
    shootTimer = 0;
  }

  // Spawn Regular Enemies / Boss
  enemyTimer++;
  if (!boss && score >= 200) {
    boss = { x: 160, y: -80, w: 100, h: 80, hp: 50, maxHp: 50, vx: 3, speed: 1.5 };
  } else if (!boss && enemyTimer > 25) {
    enemies.push({ x: Math.random() * (cvs.width - 30), y: -30, w: 30, h: 30, speed: 3.5 });
    enemyTimer = 0;
  }

  // Update Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    bullets[i].y += bullets[i].vy;
    if (bullets[i].y < 0 || bullets[i].x < 0 || bullets[i].x > cvs.width) bullets.splice(i, 1);
  }

  // Update Particles
  for(let i = particles.length - 1; i >= 0; i--) {
    p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
    if(p.life <= 0) particles.splice(i, 1);
  }

  // Update Items
  for(let i = items.length - 1; i >= 0; i--) {
    let it = items[i]; it.y += 2;
    if(it.x < player.x + player.w && it.x + 20 > player.x && it.y < player.y + player.h && it.y + 20 > player.y) {
      player.weaponLevel = 2; player.weaponTimer = 300; // 5 detik triple shot
      items.splice(i, 1);
    } else if(it.y > cvs.height) items.splice(i, 1);
  }

  // Boss Logic
  if (boss) {
    if(boss.y < 50) boss.y += boss.speed;
    else {
      boss.x += boss.vx;
      if(boss.x <= 0 || boss.x + boss.w >= cvs.width) boss.vx *= -1;
    }

    // Boss Hit Bullets
    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
        boss.hp--;
        spawnExplosion(b.x, b.y, '#f59e0b');
        bullets.splice(j, 1);
        if (boss.hp <= 0) {
          spawnExplosion(boss.x + 50, boss.y + 40, '#ef4444');
          winGame();
        }
      }
    }
  }

  // Regular Enemies Logic
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i]; e.y += e.speed;

    // Hit Player
    if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
      spawnExplosion(e.x, e.y, '#ef4444');
      enemies.splice(i, 1);
      lives--;
      if (lives <= 0) gameOver();
      continue;
    }

    // Hit Bullet
    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        spawnExplosion(e.x + 15, e.y + 15, '#facc15');
        if(Math.random() < 0.15) items.push({x: e.x, y: e.y}); // Drop PowerUp
        enemies.splice(i, 1);
        bullets.splice(j, 1);
        score += 10;
        break;
      }
    }
    if (e.y > cvs.height) enemies.splice(i, 1);
  }

  draw();
}

function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  // Background Stars
  ctx.fillStyle = '#fff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.r, s.r));

  // Player
  ctx.fillStyle = player.weaponLevel === 2 ? '#f59e0b' : '#38bdf8';
  ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Bullets
  ctx.fillStyle = '#facc15';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Items (Power Up)
  ctx.fillStyle = '#22c55e';
  items.forEach(it => { ctx.beginPath(); ctx.arc(it.x+10, it.y+10, 8, 0, Math.PI*2); ctx.fill(); });

  // Enemies
  ctx.fillStyle = '#ef4444';
  enemies.forEach(e => { ctx.beginPath(); ctx.arc(e.x + 15, e.y + 15, 15, 0, Math.PI * 2); ctx.fill(); });

  // Boss
  if (boss) {
    ctx.fillStyle = '#b91c1c';
    ctx.shadowBlur = 20; ctx.shadowColor = '#ef4444';
    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
    ctx.shadowBlur = 0;
    // HP Bar Boss
    ctx.fillStyle = '#000'; ctx.fillRect(50, 50, 320, 12);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(50, 50, (boss.hp / boss.maxHp) * 320, 12);
  }

  // Particles
  particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });

  // UI
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`SKOR: ${score}`, 15, 30);
  ctx.fillText(`NYAWA: ${'❤️'.repeat(lives)}`, 270, 30);
}

function gameOver() {
  isPlaying = false; clearInterval(gameLoop);
  document.getElementById('final-score').innerText = `Skor Akhir Lu: ${score}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

function winGame() {
  isPlaying = false; clearInterval(gameLoop);
  document.getElementById('win-screen').classList.remove('hidden');
}
</script>
</body>
</html>
