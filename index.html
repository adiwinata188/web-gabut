<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHICKEN INVASION FIXED SKOR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; touch-action: none; }
    body { background: #090d16; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #game-wrap { position: relative; width: 400px; height: 600px; border: 3px solid #38bdf8; border-radius: 12px; overflow: hidden; }
    canvas { display: block; background: #0f172a; }
    .screen { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    h1 { color: #38bdf8; margin-bottom: 10px; font-size: 1.8rem; }
    p { color: #94a3b8; margin-bottom: 20px; font-size: 0.9rem; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas" width="400" height="600"></canvas>
  
  <div id="start-screen" class="screen">
    <h1>CHICKEN INVASION 🐔</h1>
    <p>Geser Pesawat (Panah Keyboard / Drag HP)<br>Peluru Otomatis Nembak!</p>
    <button onclick="startGame()">START GAME</button>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <h1 style="color: #ef4444;">GAME OVER 💀</h1>
    <p id="final-score">Skor Lu: 0</p>
    <button onclick="startGame()">MAIN LAGI</button>
  </div>

  <div id="win-screen" class="screen hidden">
    <h1 style="color: #22c55e;">VICTORY! 🎉</h1>
    <p>Lu Berhasil Namatin Game Ini!</p>
    <button onclick="startGame()">MAIN LAGI</button>
  </div>
</div>

<script>
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');

let player, bullets, enemies, score, lives, gameLoop, isPlaying = false;
let keys = {};
let shootTimer = 0;
let enemyTimer = 0;

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  let rect = cvs.getBoundingClientRect();
  let touchX = e.touches[0].clientX - rect.left;
  if(player) player.x = Math.max(0, Math.min(cvs.width - player.w, touchX - player.w / 2));
});

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('win-screen').classList.add('hidden');
  
  player = { x: 180, y: 530, w: 40, h: 20, speed: 8 };
  bullets = [];
  enemies = [];
  score = 0;
  lives = 3;
  isPlaying = true;

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 1000 / 60);
}

function update() {
  if (!isPlaying) return;

  // Gerak Player
  if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < cvs.width - player.w) player.x += player.speed;

  // Auto Shoot
  shootTimer++;
  if (shootTimer > 8) {
    bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 12 });
    shootTimer = 0;
  }

  // Spawn Musuh
  enemyTimer++;
  if (enemyTimer > 30) {
    enemies.push({ x: Math.random() * (cvs.width - 30), y: -30, w: 30, h: 30, speed: 3 });
    enemyTimer = 0;
  }

  // Update Peluru
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= 10;
    if (bullets[i].y < 0) bullets.splice(i, 1);
  }

  // Update Musuh & Deteksi Tabrakan (FIXED)
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.y += e.speed;

    // Kena Player
    if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
      enemies.splice(i, 1);
      lives--;
      if (lives <= 0) gameOver();
      continue;
    }

    // Kena Peluru (SKOR PASTI NAMBAH!)
    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        enemies.splice(i, 1);
        bullets.splice(j, 1);
        score += 10; // Skor bertambah 10 poin per musuh!
        if (score >= 500) winGame();
        break;
      }
    }

    // Lewat bawah
    if (e.y > cvs.height) {
      enemies.splice(i, 1);
    }
  }

  draw();
}

function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  // Player
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Peluru
  ctx.fillStyle = '#facc15';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  // Musuh
  ctx.fillStyle = '#ef4444';
  enemies.forEach(e => {
    ctx.beginPath();
    ctx.arc(e.x + 15, e.y + 15, 15, 0, Math.PI * 2);
    ctx.fill();
  });

  // UI / HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`SKOR: ${score}`, 15, 30);
  ctx.fillText(`NYAWA: ${'❤️'.repeat(lives)}`, 260, 30);
}

function gameOver() {
  isPlaying = false;
  clearInterval(gameLoop);
  document.getElementById('final-score').innerText = `Skor Akhir Lu: ${score}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

function winGame() {
  isPlaying = false;
  clearInterval(gameLoop);
  document.getElementById('win-screen').classList.remove('hidden');
}
</script>
</body>
</html>
