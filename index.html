<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHICKEN INVASION: PRO ESPORTS EDITION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #game-wrap { position: relative; width: 420px; height: 640px; border: 3px solid #facc15; border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(250, 204, 21, 0.4); }
    canvas { display: block; background: #0b0f19; }
    .screen { position: absolute; inset: 0; background: rgba(11, 15, 25, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    h1 { color: #facc15; margin-bottom: 10px; font-size: 2rem; text-shadow: 0 0 15px #facc15; }
    p { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5; }
    button { background: #facc15; color: #0b0f19; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; box-shadow: 0 0 15px #facc15; transition: 0.2s; }
    button:hover { background: #eab308; color: #fff; transform: scale(1.05); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas" width="420" height="640"></canvas>
  
  <div id="start-screen" class="screen">
    <h1>PRO EDITION 🐔</h1>
    <p>Geser Pesawat (Panah / Drag HP)<br><br><b style="color:#38bdf8">Loot Neko Coin & Ambil Power-Up AWP Laser!</b></p>
    <button onclick="startGame()">START MATCH</button>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <h1 style="color: #ef4444;">WASTED 💀</h1>
    <p id="final-score">Skor Lu: 0</p>
    <button onclick="startGame()">REMATCH</button>
  </div>

  <div id="win-screen" class="screen hidden">
    <h1 style="color: #22c55e;">EZ CLUTCH! 🎉</h1>
    <p>Lu Berhasil Bantai Boss Ayam!</p>
    <button onclick="startGame()">MAIN LAGI</button>
  </div>
</div>

<script>
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');

let player, bullets, enemies, particles, items, floatTexts, boss, score, lives, gameLoop, isPlaying = false;
let keys = {}, shootTimer = 0, enemyTimer = 0, stars = [], shakeTime = 0;

for(let i=0; i<60; i++) stars.push({x: Math.random()*cvs.width, y: Math.random()*cvs.height, r: Math.random()*2.5, s: Math.random()*1.5 + 0.5});

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  let touchX = e.touches[0].clientX - cvs.getBoundingClientRect().left;
  if(player) player.x = Math.max(0, Math.min(cvs.width - player.w, touchX - player.w / 2));
});

function startGame() {
  document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
  
  player = { x: 190, y: 560, w: 40, h: 20, speed: 9, weapon: 'normal', weaponTimer: 0 };
  bullets = []; enemies = []; particles = []; items = []; floatTexts = []; boss = null;
  score = 0; lives = 3; isPlaying = true; shakeTime = 0;

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 1000 / 60);
}

function spawnExplosion(x, y, color) {
  for(let i=0; i<15; i++) particles.push({x: x, y: y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 25, color: color});
}

function addFloatText(x, y, text, color) {
  floatTexts.push({x: x, y: y, text: text, color: color, life: 30});
}

function update() {
  if (!isPlaying) return;

  if(shakeTime > 0) shakeTime--;
  stars.forEach(s => { s.y += s.s; if(s.y > cvs.height) s.y = 0; });

  if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < cvs.width - player.w) player.x += player.speed;

  if(player.weaponTimer > 0) { player.weaponTimer--; if(player.weaponTimer <= 0) player.weapon = 'normal'; }

  shootTimer++;
  if (shootTimer > 6) {
    if(player.weapon === 'normal') {
      bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 14, type: 'normal' });
    } else if(player.weapon === 'awp') {
      // Laser mematikan nembus musuh!
      bullets.push({ x: player.x + player.w/2 - 4, y: player.y, w: 8, h: 40, type: 'awp' });
    }
    shootTimer = 0;
  }

  enemyTimer++;
  if (!boss && score >= 300) {
    boss = { x: 160, y: -100, w: 100, h: 80, hp: 80, maxHp: 80, vx: 4, speed: 1.5 };
  } else if (!boss && enemyTimer > 20) {
    enemies.push({ x: Math.random() * (cvs.width - 30), y: -30, w: 30, h: 30, speed: 4 + score/150 });
    enemyTimer = 0;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= (bullets[i].type === 'awp' ? 18 : 12);
    if (bullets[i].y < -50) bullets.splice(i, 1);
  }

  for(let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].life--;
    if(particles[i].life <= 0) particles.splice(i, 1);
  }

  for(let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].y -= 1; floatTexts[i].life--;
    if(floatTexts[i].life <= 0) floatTexts.splice(i, 1);
  }

  for(let i = items.length - 1; i >= 0; i--) {
    let it = items[i]; it.y += 3;
    if(it.x < player.x + player.w && it.x + 16 > player.x && it.y < player.y + player.h && it.y + 16 > player.y) {
      if(it.type === 'coin') {
        score += 50; addFloatText(player.x, player.y, '+50 KOIN', '#facc15');
      } else {
        player.weapon = 'awp'; player.weaponTimer = 300; addFloatText(player.x, player.y, 'LASER ON!', '#ef4444');
      }
      items.splice(i, 1);
    } else if(it.y > cvs.height) items.splice(i, 1);
  }

  if (boss) {
    if(boss.y < 60) boss.y += boss.speed;
    else { boss.x += boss.vx; if(boss.x <= 0 || boss.x + boss.w >= cvs.width) boss.vx *= -1; }

    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
        boss.hp -= (b.type === 'awp' ? 3 : 1);
        spawnExplosion(b.x, b.y, '#f59e0b');
        addFloatText(b.x, b.y, (b.type === 'awp' ? '-3' : '-1'), '#fff');
        if(b.type !== 'awp') bullets.splice(j, 1);
        
        if (boss.hp <= 0) {
          spawnExplosion(boss.x + 50, boss.y + 40, '#ef4444');
          shakeTime = 30;
          winGame();
        }
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i]; e.y += e.speed;

    if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
      spawnExplosion(e.x, e.y, '#ef4444');
      shakeTime = 15;
      enemies.splice(i, 1); lives--;
      if (lives <= 0) gameOver();
      continue;
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        spawnExplosion(e.x + 15, e.y + 15, '#facc15');
        
        // Drop Koin Kuning (70%) atau Kotak Merah (10%)
        let drop = Math.random();
        if(drop < 0.1) items.push({x: e.x, y: e.y, type: 'awp'});
        else if(drop < 0.3) items.push({x: e.x, y: e.y, type: 'coin'});

        enemies.splice(i, 1);
        score += 10;
        addFloatText(e.x, e.y, '+10', '#fff');
        
        if(b.type !== 'awp') bullets.splice(j, 1); // Laser nembus, ga hancur!
        break;
      }
    }
    if (e.y > cvs.height) enemies.splice(i, 1);
  }

  draw();
}

function draw() {
  ctx.save();
  if(shakeTime > 0) ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
  
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  ctx.fillStyle = '#fff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.r, s.r));

  ctx.fillStyle = player.weapon === 'awp' ? '#ef4444' : '#38bdf8';
  ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  bullets.forEach(b => {
    ctx.fillStyle = b.type === 'awp' ? '#ef4444' : '#38bdf8';
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });

  items.forEach(it => {
    ctx.fillStyle = it.type === 'coin' ? '#facc15' : '#ef4444';
    ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(it.x, it.y, 16, 16);
    ctx.shadowBlur = 0;
  });

  ctx.fillStyle = '#ef4444';
  enemies.forEach(e => { ctx.beginPath(); ctx.arc(e.x + 15, e.y + 15, 15, 0, Math.PI * 2); ctx.fill(); });

  if (boss) {
    ctx.fillStyle = '#991b1b';
    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
    ctx.fillStyle = '#000'; ctx.fillRect(50, 20, 320, 15);
    ctx.fillStyle = '#facc15'; ctx.fillRect(50, 20, (boss.hp / boss.maxHp) * 320, 15);
  }

  particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });

  ctx.font = 'bold 16px sans-serif';
  floatTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 30;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1.0;
  });

  ctx.fillStyle = '#fff'; 
  ctx.fillText(`SCORE: ${score}`, 15, 615);
  ctx.fillText(`LIVES: ${'❤️'.repeat(lives)}`, 260, 615);

  ctx.restore();
}

function gameOver() {
  isPlaying = false; clearInterval(gameLoop);
  document.getElementById('final-score').innerText = `Skor Akhir: ${score}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

function winGame() {
  setTimeout(() => {
    isPlaying = false; clearInterval(gameLoop);
    document.getElementById('win-screen').classList.remove('hidden');
  }, 1500);
}
</script>
</body>
</html>
