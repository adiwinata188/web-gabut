<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CHICKEN INVASION: PERFECT ESPORTS EDITION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #game-wrap { position: relative; width: 420px; height: 640px; border: 3px solid #38bdf8; border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(56, 189, 248, 0.4); }
    canvas { display: block; background: #0b0f19; }
    .screen { position: absolute; inset: 0; background: rgba(11, 15, 25, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 10; }
    h1 { color: #38bdf8; margin-bottom: 10px; font-size: 2rem; text-shadow: 0 0 15px #38bdf8; }
    p { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.5; }
    button { background: #38bdf8; color: #0b0f19; border: none; padding: 14px 28px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin: 5px; width: 80%; transition: 0.2s; }
    button:hover { background: #0ea5e9; color: #fff; transform: scale(1.05); }
    #pause-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 5px; cursor: pointer; z-index: 5; font-weight: bold; border: none; color: white; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas" width="420" height="640"></canvas>
  <button id="pause-btn" onclick="togglePause()">II PAUSE</button>
  
  <div id="start-screen" class="screen">
    <h1>PERFECT EDITION 🐔</h1>
    <p><b>Laptop:</b> Geser (Panah/A,D) | Nembak (SPASI)<br><b>HP:</b> Geser (Drag) | Nembak (Otomatis)<br><br><span style="color:#facc15">Loot Neko Coin & Ambil Triple Shot!</span></p>
    <button onclick="startGame()">START MATCH</button>
  </div>

  <div id="pause-screen" class="screen hidden">
    <h1 style="color: #facc15;">PAUSED</h1>
    <button onclick="togglePause()">RESUME</button>
  </div>

  <div id="upgrade-screen" class="screen hidden">
    <h1 style="color: #22c55e;">LEVEL UP!</h1>
    <p>Skor Tembus Kelipatan 1000!</p>
    <button onclick="applyUpgrade('damage')">🗡️ +1 DAMAGE (Lebih Sakit)</button>
    <button onclick="applyUpgrade('firerate')">🔫 +FIRE RATE (Nembak Cepat)</button>
    <button onclick="applyUpgrade('heal')">❤️ FULL HEAL & +MAX HP</button>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <h1 style="color: #ef4444;">WASTED 💀</h1>
    <p id="final-score">Skor Lu: 0</p>
    <button onclick="startGame()">REMATCH</button>
  </div>
</div>

<script>
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');

let state = 'START'; 
let player, bullets, bossBullets, enemies, items, particles, floatTexts, boss;
let score = 0, gameLoop;
let keys = {}, shootTimer = 0, enemyTimer = 0, stars = [], shakeTime = 0;
let nextBossScore = 500, nextUpgradeScore = 1000, hpMultiplier = 1;
let isMobile = false; // Deteksi touch screen

// Setup Bintang Background
for(let i=0; i<60; i++) stars.push({x: Math.random()*cvs.width, y: Math.random()*cvs.height, r: Math.random()*2, s: Math.random()*1 + 0.2});

// Input Listeners
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'KeyP') togglePause();
});
window.addEventListener('keyup', e => keys[e.code] = false);

cvs.addEventListener('touchstart', () => isMobile = true, {passive: true});
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  isMobile = true;
  if(state !== 'PLAYING') return;
  let touchX = e.touches[0].clientX - cvs.getBoundingClientRect().left;
  if(player) player.x = Math.max(0, Math.min(cvs.width - player.w, touchX - player.w / 2));
}, {passive: false});

function togglePause() {
  if(state === 'PLAYING') {
    state = 'PAUSED';
    document.getElementById('pause-screen').classList.remove('hidden');
  } else if (state === 'PAUSED') {
    state = 'PLAYING';
    document.getElementById('pause-screen').classList.add('hidden');
  }
}

function startGame() {
  document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
  
  // STATS PLAYER AWAL (Darah 100)
  player = { x: 190, y: 560, w: 40, h: 20, speed: 6, hp: 100, maxHp: 100, damage: 1, fireRate: 15, weapon: 'normal', weaponTimer: 0 };
  bullets = []; bossBullets = []; enemies = []; items = []; particles = []; floatTexts = []; boss = null;
  score = 0; state = 'PLAYING'; shakeTime = 0;
  nextBossScore = 500; nextUpgradeScore = 1000; hpMultiplier = 1; shootTimer = 15;

  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 1000 / 60);
}

function applyUpgrade(type) {
  if(type === 'damage') player.damage += 1;
  if(type === 'firerate') player.fireRate = Math.max(5, player.fireRate - 2);
  if(type === 'heal') { player.maxHp += 50; player.hp = player.maxHp; }
  
  state = 'PLAYING';
  document.getElementById('upgrade-screen').classList.add('hidden');
}

function spawnExplosion(x, y, color) {
  for(let i=0; i<15; i++) particles.push({x: x, y: y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 25, color: color});
}
function addFloatText(x, y, text, color) {
  floatTexts.push({x: x, y: y, text: text, color: color, life: 40});
}

function shoot() {
  if(player.weapon === 'normal') {
    bullets.push({ x: player.x + player.w/2 - 3, y: player.y, vx: 0, vy: -12, w: 6, h: 14 });
  } else if (player.weapon === 'triple') {
    bullets.push({ x: player.x + player.w/2 - 3, y: player.y, vx: 0, vy: -12, w: 6, h: 14 });
    bullets.push({ x: player.x, y: player.y, vx: -3, vy: -10, w: 6, h: 14 });
    bullets.push({ x: player.x + player.w - 6, y: player.y, vx: 3, vy: -10, w: 6, h: 14 });
  }
}

function update() {
  if (state !== 'PLAYING') return;

  if(shakeTime > 0) shakeTime--;
  stars.forEach(s => { s.y += s.s; if(s.y > cvs.height) s.y = 0; });

  // Move Player (Panah Kiri/Kanan ATAU A/D)
  if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
  if ((keys['ArrowRight'] || keys['KeyD']) && player.x < cvs.width - player.w) player.x += player.speed;

  // Cek Trigger Boss & Upgrade
  hpMultiplier = 1 + Math.floor(score / 500) * 0.5; // Darah musuh naik seiring skor

  if(score >= nextUpgradeScore) {
    nextUpgradeScore += 1000;
    state = 'UPGRADE';
    document.getElementById('upgrade-screen').classList.remove('hidden');
    return;
  }

  // Weapon Timer
  if(player.weaponTimer > 0) { player.weaponTimer--; if(player.weaponTimer <= 0) player.weapon = 'normal'; }

  // Shooting Logic (Manual Spasi vs Auto HP)
  shootTimer++;
  if ((isMobile || keys['Space']) && shootTimer >= player.fireRate) {
    shoot();
    shootTimer = 0;
  }

  // Musuh Spawner
  enemyTimer++;
  if (!boss && score >= nextBossScore) {
    let bHp = 150 + (Math.floor(score/500) * 50); // HP Boss Naik
    boss = { x: 160, y: -100, w: 100, h: 80, hp: bHp, maxHp: bHp, vx: 3, speed: 1.5, shootTimer: 0 };
    nextBossScore += 500;
  } else if (!boss && enemyTimer > 35) {
    let rand = Math.random();
    if (rand < 0.2) { 
      enemies.push({ x: Math.random() * (cvs.width - 40), y: -40, w: 40, h: 40, speed: 1.8, hp: 5 * hpMultiplier, maxHp: 5 * hpMultiplier, type: 'tank', pts: 50 });
    } else { 
      enemies.push({ x: Math.random() * (cvs.width - 25), y: -25, w: 25, h: 25, speed: 3.5, hp: 1 * hpMultiplier, maxHp: 1 * hpMultiplier, type: 'normal', pts: 10 });
    }
    enemyTimer = 0;
  }

  // Update Player Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    bullets[i].y += bullets[i].vy;
    if (bullets[i].y < -20 || bullets[i].x < -20 || bullets[i].x > cvs.width + 20) bullets.splice(i, 1);
  }

  // Update Items (Neko Coin & Triple Shot)
  for (let i = items.length - 1; i >= 0; i--) {
    let it = items[i]; it.y += 3;
    if (it.x < player.x + player.w && it.x + 16 > player.x && it.y < player.y + player.h && it.y + 16 > player.y) {
      if(it.type === 'coin') {
        score += 50; 
        player.hp = Math.min(player.maxHp, player.hp + 10); // Heal 10 HP
        addFloatText(player.x, player.y, '+50 KOIN', '#facc15');
      } else if (it.type === 'powerup') {
        player.weapon = 'triple'; 
        player.weaponTimer = 300; // 5 Detik Triple Shot
        addFloatText(player.x, player.y, 'TRIPLE SHOT!', '#38bdf8');
      }
      items.splice(i, 1);
    } else if (it.y > cvs.height) {
      items.splice(i, 1);
    }
  }

  // Update Boss Bullets
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    bossBullets[i].y += 5;
    if(bossBullets[i].x < player.x + player.w && bossBullets[i].x + bossBullets[i].w > player.x && bossBullets[i].y < player.y + player.h && bossBullets[i].y + bossBullets[i].h > player.y) {
      bossBullets.splice(i, 1);
      player.hp -= 20; // Kena peluru boss sakit
      shakeTime = 15;
      spawnExplosion(player.x+20, player.y, '#38bdf8');
      if(player.hp <= 0) gameOver();
    } else if (bossBullets[i].y > cvs.height) {
      bossBullets.splice(i, 1);
    }
  }

  // Visuals Update
  for(let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy; particles[i].life--;
    if(particles[i].life <= 0) particles.splice(i, 1);
  }
  for(let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].y -= 1; floatTexts[i].life--;
    if(floatTexts[i].life <= 0) floatTexts.splice(i, 1);
  }

  // Boss Logic
  if (boss) {
    if(boss.y < 60) boss.y += boss.speed;
    else { boss.x += boss.vx; if(boss.x <= 0 || boss.x + boss.w >= cvs.width) boss.vx *= -1; }

    boss.shootTimer++;
    if(boss.shootTimer > 50) {
      bossBullets.push({ x: boss.x + boss.w/2 - 4, y: boss.y + boss.h, w: 8, h: 20 });
      boss.shootTimer = 0;
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
        boss.hp -= player.damage;
        spawnExplosion(b.x, b.y, '#facc15');
        bullets.splice(j, 1);
        
        if (boss.hp <= 0) {
          spawnExplosion(boss.x + 50, boss.y + 40, '#ef4444');
          shakeTime = 40;
          score += 200; 
          addFloatText(boss.x, boss.y, '+200 BOSS KILL', '#facc15');
          // Drop banyak koin pas boss mati
          for(let k=0; k<5; k++) items.push({x: boss.x + Math.random()*80, y: boss.y + Math.random()*50, type: 'coin'});
          boss = null;
        }
      }
    }
  }

  // Enemies Logic
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i]; e.y += e.speed;

    // Tabrak Player
    if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
      spawnExplosion(e.x, e.y, '#ef4444');
      shakeTime = 15;
      player.hp -= (e.type === 'tank' ? 30 : 15); // Damage tabrak
      enemies.splice(i, 1); 
      if (player.hp <= 0) gameOver();
      continue;
    }

    // Ditembak Player
    for (let j = bullets.length - 1; j >= 0; j--) {
      let b = bullets[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        e.hp -= player.damage;
        bullets.splice(j, 1);
        spawnExplosion(b.x, b.y, '#facc15');
        
        if(e.hp <= 0) {
          score += e.pts;
          addFloatText(e.x, e.y, `+${e.pts}`, e.type === 'tank' ? '#f59e0b' : '#fff');
          
          // Drop Rate: 15% Coin, 5% Triple Shot
          let drop = Math.random();
          if(drop < 0.05) items.push({x: e.x, y: e.y, type: 'powerup'});
          else if(drop < 0.20) items.push({x: e.x, y: e.y, type: 'coin'});

          enemies.splice(i, 1);
        }
        break;
      }
    }
    if (e.y > cvs.height) enemies.splice(i, 1);
  }

  draw();
}

function draw() {
  ctx.save();
  if(shakeTime > 0) ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);
  
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  ctx.fillStyle = '#fff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.r, s.r));

  // Player
  ctx.fillStyle = player.weapon === 'triple' ? '#38bdf8' : '#cbd5e1';
  ctx.shadowBlur = 10; ctx.shadowColor = '#38bdf8';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Bullets
  ctx.fillStyle = '#38bdf8';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  ctx.fillStyle = '#ef4444';
  ctx.shadowBlur = 10; ctx.shadowColor = '#ef4444';
  bossBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  ctx.shadowBlur = 0;

  // Items
  items.forEach(it => {
    ctx.fillStyle = it.type === 'coin' ? '#facc15' : '#38bdf8'; // Kuning (Koin), Biru (Triple Shot)
    ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(it.x, it.y, 16, 16);
    ctx.shadowBlur = 0;
  });

  // Enemies
  enemies.forEach(e => { 
    ctx.fillStyle = e.type === 'tank' ? '#f59e0b' : '#ef4444';
    ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI * 2); ctx.fill(); 
    if(e.type === 'tank' && e.hp < e.maxHp) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x, e.y - 10, e.w, 4);
      ctx.fillStyle = '#22c55e'; ctx.fillRect(e.x, e.y - 10, (e.hp/e.maxHp)*e.w, 4);
    }
  });

  // Boss
  if (boss) {
    ctx.fillStyle = '#991b1b';
    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
    ctx.fillStyle = '#facc15'; ctx.fillRect(boss.x+20, boss.y+50, 15, 10); ctx.fillRect(boss.x+65, boss.y+50, 15, 10);
    ctx.fillStyle = '#000'; ctx.fillRect(50, 20, 320, 15);
    ctx.fillStyle = '#facc15'; ctx.fillRect(50, 20, (boss.hp / boss.maxHp) * 320, 15);
  }

  particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });

  ctx.font = 'bold 16px sans-serif';
  floatTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = ft.life / 40;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.globalAlpha = 1.0;
  });

  // UI PINDAH KE ATAS BIAR GAK KEPOTONG LAYAR LU
  ctx.fillStyle = '#fff'; 
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`SCORE: ${score}`, 15, 30);
  
  // PLAYER HP BAR (DI BAWAH SCORE)
  ctx.fillStyle = '#000'; ctx.fillRect(15, 45, 150, 15);
  ctx.fillStyle = player.hp > 30 ? '#22c55e' : '#ef4444'; 
  ctx.fillRect(15, 45, (Math.max(0, player.hp) / player.maxHp) * 150, 15);
  ctx.fillStyle = '#fff';
  ctx.font = '12px sans-serif';
  ctx.fillText(`HP: ${Math.floor(player.hp)}/${player.maxHp}`, 20, 57);

  ctx.restore();
}

function gameOver() {
  state = 'GAMEOVER';
  document.getElementById('final-score').innerText = `Skor Akhir: ${score}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}
</script>
</body>
</html>
