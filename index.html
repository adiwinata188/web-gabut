<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHICKEN BUTT: THE GAME</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: sans-serif; }
    #game-container { border: 4px solid #38bdf8; border-radius: 12px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
  </style>
</head>
<body>

<div id="game-container"></div>

<script>
const config = {
  type: Phaser.AUTO,
  width: 400,
  height: 600,
  parent: 'game-container',
  backgroundColor: '#1e293b',
  physics: { default: 'arcade', arcade: { gravity: { y: 300 }, debug: false } },
  scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);
let player, chickens, score = 0, scoreText;

function preload() {
  // Generate Canvas Textures secara otomatis tanpa butuh file gambar eksternal!
  let g = this.make.graphics({x: 0, y: 0, add: false});
  g.fillStyle(0x38bdf8, 1);
  g.fillRect(0, 0, 80, 20);
  g.generateTexture('basket', 80, 20);

  let g2 = this.make.graphics({x: 0, y: 0, add: false});
  g2.fillStyle(0xf59e0b, 1);
  g2.fillCircle(15, 15, 15);
  g2.generateTexture('chicken', 30, 30);
}

function create() {
  player = this.physics.add.sprite(200, 550, 'basket').setImmovable(true);
  player.body.allowGravity = false;
  player.setCollideWorldBounds(true);

  chickens = this.physics.add.group();

  this.time.addEvent({
    delay: 700,
    callback: () => {
      let x = Phaser.Math.Between(20, 380);
      let chicken = chickens.create(x, 0, 'chicken');
      chicken.setBounce(0.6);
      chicken.setVelocity(Phaser.Math.Between(-50, 50), Phaser.Math.Between(50, 150));
    },
    loop: true
  });

  scoreText = this.add.text(16, 16, 'Chicken Caught: 0', { fontSize: '18px', fill: '#fff' });

  this.physics.add.overlap(player, chickens, (p, c) => {
    c.destroy();
    score += 10;
    scoreText.setText('Chicken Caught: ' + score);
  }, null, this);

  this.input.on('pointermove', (pointer) => {
    player.x = pointer.x;
  });
}

function update() {}
</script>
</body>
</html>
