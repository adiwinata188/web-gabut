<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Interaktif Super Canggih</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
    p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 1.5rem; }
    .btn { display: block; width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 0.8rem; margin: 0.5rem 0; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0ea5e9; color: #fff; transform: scale(1.03); }
    .falling-emoji { position: absolute; top: -50px; font-size: 2rem; animation: fall 3s linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Raja Chicken Butt 🐔</h1>
    <p>Web Interaktif Buatan AI Yang Lu Bilang Cupu</p>
    <button class="btn" onclick="playMabar()">Mabar CS2 / Apex</button>
    <button class="btn" onclick="playExcel()">Auto Rekap Excel</button>
    <button class="btn" onclick="rainChicken()">Hujan Chicken Butt 🍗</button>
  </div>

  <script>
    function playMabar() {
      alert("🎮 SIAP-SIAP! Lu bakal di-carry mabar CS2/Apex!");
    }
    function playExcel() {
      alert("📊 DUA KIK! Semua PivotTable & Slicer langsung beres!");
    }
    function rainChicken() {
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const emoji = document.createElement('div');
          emoji.classList.add('falling-emoji');
          emoji.innerText = Math.random() > 0.5 ? '🍗' : '🐔';
          emoji.style.left = Math.random() * 100 + 'vw';
          document.body.appendChild(emoji);
          setTimeout(() => emoji.remove(), 3000);
        }, i * 100);
      }
    }
  </script>
</body>
</html>
